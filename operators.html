<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <h1>Operators</h1>
    <script>
        let a = 10;
        let b = 20;

        console.log("Addition: " + (a + b));
        console.log("Subtraction: " + (a - b));
        console.log("Multiplication: " + (a * b));
        console.log("Division: " + (a / b));
        console.log("Modulus: " + (a % b));
        console.log("Exponentiation: " + (a ** 2));

        console.log("Equal to: " + (a == b));
        console.log("Not equal to: " + (a != b));
        console.log("Greater than: " + (a > b));
        console.log("Less than: " + (a < b));
        console.log("Greater than or equal to: " + (a >= b));
        console.log("Less than or equal to: " + (a <= b));
        let num=12;
        let str="12";
        console.log("Strict Equal to(===): " + (num === str));
        console.log("Loose Equal to(==): " + (num == str));

        let c = 5;
        c += 10;
        console.log("Assignment (+=): " + c);
        c -= 3;
        console.log("Assignment (-=): " + c);

        let d = 5;
        console.log("Increment: " + (++d));
        console.log("Decrement: " + (--d));

        let x = true;
        let y = false;
        console.log("Logical AND: " + (x && y));
        console.log("Logical OR: " + (x || y));
        console.log("Logical NOT: " + (!x));
    </script>
</body>
</html>
